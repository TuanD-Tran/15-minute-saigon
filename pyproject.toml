[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saigon15"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "duckdb",
  "h3>=4",
  "networkx",
  "numpy",
  "pandas",
  "pyarrow",
  "scipy",
  "requests",
  "folium",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100